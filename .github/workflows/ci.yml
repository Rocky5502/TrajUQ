name: CI

on:
  push:
  pull_request:

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,math]"

      - name: Complete CPU verification
        run: |
          python scripts/verify_cpu.py \
            --output results/ci_cpu_verification.json \
            --logs-dir results/ci_cpu_verification_logs

      - name: Upload verification artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trajuq-cpu-verification
          path: |
            results/ci_cpu_verification.json
            results/ci_cpu_verification_logs/
            results/math500_scorer_audit.json
