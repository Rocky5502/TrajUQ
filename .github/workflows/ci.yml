name: CI

on:
  push:
  pull_request:

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,math]"

      - name: Lint
        run: ruff check src tests scripts

      - name: Unit tests
        run: pytest -q

      - name: CPU end-to-end smoke
        run: python scripts/smoke_end_to_end.py --output-dir results/ci_smoke

      - name: MATH-500 scorer audit
        run: python scripts/audit_math500_scorer.py --output results/ci_math500_scorer_audit.json

      - name: Paper anonymity audit
        run: python scripts/audit_paper.py
