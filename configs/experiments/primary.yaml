experiment:
  name: trajuq_primary_naacl2027
  status: PRE_EXPERIMENT_DO_NOT_REPORT_NUMBERS
  seed: 2027

compute_budget:
  target_wall_clock_hours: 72
  operational_reserve_hours: 6
  target_gpu_count: 1
  target_gpu_class: NVIDIA_A100_SXM4_80GB
  execution_priority:
    - primary
    - primary_analysis
    - rq3_adaptive
    - rq2_repeated_sampling
    - paper_render
  dataset_cap_policy: sha256_id_rank_v1
  dataset_cap_manifest: data/manifests/evaluation_splits.json
  continuous_execution: true
  note: >
    The three-day single-A100 envelope is an operational budget, not a claim
    that runtime is known in advance. Six hours are reserved pre-outcome for
    model-load/download overhead, CPU analysis/rendering, evidence export, and
    limited retry margin that the generation timing estimator excludes.
    Dataset caps are frozen pre-outcome; scientific gates are never weakened
    to satisfy the wall-clock target.

models:
  primary:
    - configs/models/llada.yaml
    - configs/models/sdar.yaml
    - configs/models/dream.yaml
  diagnostic:
    - configs/models/flare.yaml

datasets:
  - gsm8k
  - math500
  - gpqa_diamond
  - arc_challenge
  - mmlu_pro
  - truthfulqa

splits:
  calibration_fraction: 0.30
  split_seed: 2027
  freeze_before_generation: true

trajectory:
  primary_features:
    - decision_entropy_mean
    - entropy_mean
    - entropy_p90
    - entropy_slope
    - margin_mean
    - margin_min
    - js_mean
    - js_p90
    - js_slope
    - late_js_mean
    - revision_rate
    - late_revision_rate
    - mask_auc
    - late_mask_fraction
    - commitment_time_mean

calibration:
  primary: logistic
  sensitivity: [isotonic]
  fit_on: calibration_only
  isotonic:
    role: supplementary_calibration_sensitivity
    base_estimator: standardized_logistic
    cv_folds: 5
    ensemble: false
    min_calibration_samples: 250
    min_class_count: 25

metrics:
  discrimination: [auroc, auprc]
  calibration: [brier, nll, ece]
  selective: [aurc_discrete, risk_at_50_coverage, risk_at_80_coverage]
  efficiency: [wall_time_seconds, peak_gpu_memory_bytes, denoising_steps]

statistics:
  primary_endpoint: hierarchical_macro_auroc_improvement
  secondary_endpoints:
    - hierarchical_macro_auprc_improvement
    - hierarchical_macro_aurc_improvement
  rq1_claim_gate:
    macro_auroc_ci_low_gt_zero: true
    min_positive_model_families: 2
  bootstrap:
    paired: true
    stratified_by_error: true
    n_boot: 2000
    confidence_level: 0.95

adaptive_compute:
  execution_semantics: selective_second_pass_rerun
  risk_model: trajectory_plus_decision_logistic
  crossfit_policy_selection: true
  crossfit_folds: 5
  threshold_selection: out_of_fold_calibration_only
  matched_compute: true
  primary_max_refine_fraction: 0.50
  sensitivity_max_refine_fraction: [0.25, 0.75]
  paired_bootstrap_n: 2000
  report_deltas_vs: [base, fixed_refined, random_refinement]
  budgets:
    llada:
      base_steps: 32
      refined_steps: 128
    dream:
      base_steps: 32
      refined_steps: 128
    sdar:
      base_denoising_steps: 2
      refined_denoising_steps: 4

integrity:
  outcome_isolation: true
  no_test_tuning: true
  no_overwrite_completed_runs: true

feature_ablation:
  frozen_groups:
    - decision_only
    - decision_plus_distribution
    - decision_plus_stability
    - decision_plus_persistence
    - full
    - full_without_js
    - full_without_revisions
    - full_without_persistence
  comparison_baseline: decision_only
  paired_bootstrap: true

baselines:
  primary_single_run:
    - decision_entropy_logistic
  diagnostics:
    - raw_trajectory_risk
  expensive:
    repeated_sampling:
      samples: 5
      seeds: [2027, 2028, 2029, 2030, 2031]
      temperature: 0.2
      top_p: 1.0
      features: [sample_disagreement, sample_vote_entropy, sample_unique_fraction]
      calibration: logistic
      compute_report_required: true
      eligible_datasets:
        - gsm8k
        - math500
        - gpqa_diamond
        - mmlu_pro
      excluded_datasets:
        arc_challenge: >
          Secondary compute-bounded comparator excludes ARC-Challenge because
          broad multiple-choice coverage is already represented by MMLU-Pro;
          ARC-Challenge remains in the full 18-cell primary and RQ3 analyses.
        truthfulqa: >
          Secondary compute-bounded comparator excludes TruthfulQA to preserve
          the 72-hour single-A100 envelope; TruthfulQA remains in the full
          18-cell primary and RQ3 analyses.
      math500_clustering: pairwise_math_verify_connected_components_v1


hybrid_diagnostic:
  role: rq4_diagnostic_not_primary_endpoint
  checkpoint_family: flare
  require_same_checkpoint: true
  calibration: logistic
  features:
    - exact_text_disagreement
    - parsed_answer_available
    - parsed_answer_disagreement
    - token_metrics_available
    - normalized_token_edit_distance
    - token_common_prefix_fraction
    - normalized_length_difference
  correctness_source: external_benchmark_scorer
  ar_path_is_ground_truth: false
