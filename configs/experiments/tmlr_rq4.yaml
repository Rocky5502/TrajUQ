generation:
  deterministic_trace_seed: 2027
  prompt_source: exact_prompt_field_from_hash_bound_original_partition
  prompt_rendering: tokenizer_apply_chat_template_single_user_message_add_generation_prompt
  outcome_blind_canary_rows_per_dataset: 2
  five_sample_baseline:
    seeds: [2027, 2028, 2029, 2030, 2031]
    do_sample: true
    temperature: 0.7
    top_p: 0.95
    top_k: 0
    max_new_tokens: 512
comparators:
  - mean_token_entropy
  - max_token_entropy
  - late_token_entropy
  - mean_selected_token_nll
  - min_token_margin
  - entropy_slope
  - entropy_volatility
  - five_sample_semantic_disagreement
models:
  within_paradigm:
    type: standardized_logistic
    fit_on: calibration_only
    standardization: calibration_mean_and_population_std
    penalty: l2
    regularization_c: 1.0
    solver: lbfgs
    max_iter: 2000
    random_state: 2027
  transfer:
    directions:
      - diffusion_to_ar
      - ar_to_diffusion
    feature_space: shared_trajectory_summaries_only
endpoints:
  primary: equal_cell_macro_aurc_improvement_over_mean_token_entropy
  secondary:
    - auroc
    - auprc
    - brier
    - nll
    - ece_15
    - risk_at_50_coverage
    - risk_at_80_coverage
hypotheses:
  h4a: Within-paradigm trajectory summaries improve selective risk over endpoint confidence.
  h4b: Diffusion-specific revision and commitment features add information unavailable to AR token traces.
  h4c: Cross-paradigm calibration transfer is weaker than within-paradigm calibration, revealing architecture-specific uncertainty geometry.
reporting:
  retain_negative_results: true
  no_pooling_across_cells: true
  equal_cell_weight: true
  paired_class_stratified_bootstrap: true
  bootstrap_replicates: 10000
  bootstrap_seed: 2027
  confidence_level: 0.95
  confirmatory_family: [h4a, h4b, h4c]
  multiplicity_correction: holm_bonferroni
  two_sided_alpha: 0.05
  distinguish_confirmatory_from_exploratory: true
freeze_gate:
  producer: scripts/freeze_rq4.py
  required_artifact: results/rq4/freeze_manifest.json
  required_before_any_rq4_generation:
    - exact_tokenizer_revision_matches_model_revision
    - tokenizer_files_sha256_ledger
    - rendered_chat_template_sha256
    - model_config_sha256
    - dataset_partition_hashes_match_this_file
    - telemetry_schema_sha256
    - clean_source_commit
forbidden:
  - modifying_the_original_rq1_gate
  - adding_test_labels_to_raw_telemetry
  - choosing_features_after_test_results
  - claiming_ar_output_is_ground_truth
  - treating_cross_architecture_scores_as_calibrated_without_held_out_validation
