project:
  name: TrajUQ
  target: NAACL 2027 via ARR
  paper_title: "When Diffusion Language Models Are Unsure: Trajectory-Aware Uncertainty for Selective and Adaptive Generation"
  primary_models: [llada, sdar, dream]
  primary_datasets:
    - gsm8k
    - math500
    - gpqa_diamond
    - arc_challenge
    - mmlu_pro
    - truthfulqa
  primary_cells: 18
  repeated_sampling_seeds: [2027, 2028, 2029, 2030, 2031]
  adaptive_primary_cap: 0.50
  adaptive_sensitivity_caps: [0.25, 0.75]

implementation:
  - id: trajectory_schema
    label: "Schema-v4 active/unresolved trajectory instrumentation"
    state: DONE
    evidence:
      - src/trajuq/schema.py
      - src/trajuq/trajectory.py
      - src/trajuq/statistics.py
  - id: primary_features
    label: "Frozen primary trajectory and decision-time feature sets"
    state: DONE
    evidence:
      - src/trajuq/features.py
      - configs/experiments/primary.yaml
  - id: calibration
    label: "Held-out logistic/isotonic calibration and error probabilities"
    state: DONE
    evidence:
      - src/trajuq/calibration.py
      - scripts/evaluate_run.py
  - id: selective_risk
    label: "Tie-aware AURC and risk-at-coverage metrics"
    state: DONE
    evidence:
      - src/trajuq/evaluation.py
      - tests/test_evaluation.py
  - id: outcome_isolation
    label: "Raw/scored separation, prompt-hash checks, and run auditing"
    state: DONE
    evidence:
      - scripts/audit_run.py
      - scripts/score_outputs.py
  - id: primary_planner
    label: "Frozen 3x6 primary-matrix planner"
    state: DONE
    evidence:
      - scripts/plan_primary_matrix.py
      - docs/PRIMARY_MATRIX_RUNBOOK.md
  - id: resumable_primary_executor
    label: "Resumable primary executor with clean frozen-commit protocol-v1 audit reuse"
    state: DONE
    evidence:
      - scripts/execute_primary_plan.py
      - tests/test_execute_primary_plan.py
  - id: primary_analysis
    label: "Frozen-audit-bound 18-cell analysis ledger with primary and feature-ablation hierarchical macros"
    state: DONE
    evidence:
      - scripts/plan_primary_analysis.py
      - scripts/aggregate_cells.py
      - scripts/aggregate_feature_ablation.py
  - id: resumable_primary_analysis_executor
    label: "Resumable provenance-checked primary-analysis executor"
    state: DONE
    evidence:
      - scripts/execute_primary_analysis.py
      - tests/test_execute_primary_analysis.py
  - id: rq1_gate
    label: "Pre-registered positive-claim gate for RQ1"
    state: DONE
    evidence:
      - scripts/evaluate_rq1_claim_gate.py
      - tests/test_rq1_claim_gate.py
  - id: repeated_sampling
    label: "Hash-bound five-sample baseline with complete 18-cell compute accounting"
    state: DONE
    evidence:
      - scripts/run_repeated_samples.py
      - scripts/plan_repeated_sampling.py
      - scripts/aggregate_repeated_baseline.py
  - id: resumable_repeated_executor
    label: "Resumable five-sample executor with frozen-commit seed-audit reuse and source-bound macro validation"
    state: DONE
    evidence:
      - scripts/execute_repeated_sampling.py
      - tests/test_execute_repeated_sampling.py
  - id: math500_symbolic
    label: "Pinned MATH-500 scoring and reference-free symbolic vote clustering"
    state: DONE
    evidence:
      - src/trajuq/scoring.py
      - scripts/audit_math500_scorer.py
      - scripts/export_math500_scorer_review.py
      - docs/MATH500_SCORING.md
  - id: adaptive_rq3
    label: "Hash-bound second-pass adaptive compute with 50% primary and 25/75% sensitivities"
    state: DONE
    evidence:
      - scripts/evaluate_adaptive.py
      - scripts/plan_adaptive_runs.py
      - scripts/aggregate_adaptive.py
      - src/trajuq/adaptive_aggregation.py
  - id: resumable_adaptive_executor
    label: "Resumable adaptive RQ3 executor with frozen-commit audits, cap gates, and source-bound macro validation"
    state: DONE
    evidence:
      - scripts/execute_adaptive_plan.py
      - tests/test_execute_adaptive_plan.py
  - id: hybrid_rq4
    label: "Same-checkpoint AR/diffusion RQ4 diagnostic pipeline"
    state: DONE
    evidence:
      - scripts/join_hybrid_paths.py
      - scripts/evaluate_hybrid_diagnostic.py
      - docs/FLARE_INSTRUMENTATION.md
  - id: revision_ledger
    label: "Commit-bound immutable model/dataset revision ledger"
    state: DONE
    evidence:
      - scripts/resolve_experiment_revisions.py
      - scripts/resolve_hf_revision.py
  - id: gated_dataset_access
    label: "Exact-revision gated-dataset access preflight without benchmark-content logging"
    state: DONE
    evidence:
      - scripts/verify_gated_dataset_access.py
      - scripts/primary_readiness.py
      - tests/test_primary_readiness.py
  - id: dataset_contract_smoke
    label: "Exact-revision live normalizer/scorer smoke for all six primary datasets without row-content retention"
    state: DONE
    evidence:
      - scripts/verify_dataset_contracts.py
      - tests/test_dataset_contracts.py
      - scripts/primary_readiness.py
      - scripts/freeze_preprimary.sh
      - scripts/freeze_preprimary_windows.ps1
  - id: artifact_derived_paper
    label: "Config-revalidated claim-gated manuscript and result-figure renderers"
    state: DONE
    evidence:
      - scripts/render_results_tex.py
      - scripts/render_paper_result_figures.py
      - paper/generated_results.tex
      - paper/main.tex
      - paper/appendix.tex
  - id: anonymous_supplement
    label: "Anonymous ARR software-supplement builder"
    state: DONE
    evidence:
      - scripts/build_anonymous_supplement.py
  - id: overleaf_package
    label: "Deterministic anonymous Overleaf package pinned to official ACL style"
    state: DONE
    evidence:
      - scripts/build_overleaf_package.py
      - tests/test_build_overleaf_package.py
      - paper/README.md
  - id: a100_campaign
    label: "Guarded staged A100 campaign runner with explicit human-review stops"
    state: DONE
    evidence:
      - scripts/a100_campaign_linux.sh
      - docs/A100_EXECUTION.md
      - tests/test_pilot_script_contract.py
  - id: a100_compute_estimator
    label: "Frozen-input A100 compute forecast from audited model timing traces"
    state: DONE
    evidence:
      - scripts/estimate_a100_campaign.py
      - tests/test_estimate_a100_campaign.py
      - docs/A100_EXECUTION.md
  - id: submission_readiness_gate
    label: "Final ARR gate separating historical experiment provenance from a clean submission checkout"
    state: DONE
    evidence:
      - scripts/submission_readiness.py
      - tests/test_submission_readiness.py
  - id: cpu_verification
    label: "Cross-platform CPU verification scripts"
    state: DONE
    evidence:
      - scripts/verify_cpu.ps1
      - scripts/verify_cpu.sh
      - scripts/freeze_preprimary_windows.ps1
      - scripts/freeze_preprimary.sh
      - .github/workflows/ci.yml
  - id: clean_checkout_provenance
    label: "Clean-checkout provenance guards from pre-primary freeze through frozen execution"
    state: DONE
    evidence:
      - scripts/pilot_windows.ps1
      - scripts/primary_readiness.py
      - scripts/plan_primary_matrix.py
      - scripts/execute_primary_plan.py
      - scripts/execute_primary_analysis.py
      - scripts/execute_repeated_sampling.py
      - scripts/execute_adaptive_plan.py
  - id: private_handoff
    label: "Privacy-scanned deterministic research handoff bundle and canonical continuation prompt"
    state: DONE
    evidence:
      - NEW_CHAT_MASTER_PROMPT.md
      - scripts/export_research_handoff.py
      - tests/test_export_research_handoff.py
  - id: guarded_preprimary_wrappers
    label: "Frozen-state guarded parity/pilot/MATH wrappers with clean commit-bound run-audit and human-review source bindings"
    state: DONE
    evidence:
      - scripts/pilot_windows.ps1
      - scripts/parity_remaining_windows.ps1
      - scripts/math500_gate_windows.ps1
      - scripts/pilot_linux.sh
      - scripts/parity_remaining_linux.sh
      - scripts/math500_gate_linux.sh
      - tests/test_pilot_script_contract.py
      - tests/test_remaining_parity_script_contract.py
      - tests/test_math500_gate_script_contract.py

execution_gates:
  - id: cpu_verification_artifact
    label: "Clean-commit CPU verification suite"
    stage: pre_primary
    issue: 6
    action: "Run scripts/freeze_preprimary_windows.ps1 on Windows or bash scripts/freeze_preprimary.sh on Linux/macOS from a clean commit. Both first refuse any pre-existing immutable freeze evidence, then run CPU verification, write the commit-bound revision ledger, verify exact-revision gated access, smoke-test all six exact-revision dataset normalizer/scorer contracts without storing row content, re-check worktree cleanliness, refresh project status, and export dist/trajuq_preprimary_handoff.zip."
    artifact: results/cpu_verification.json
    expect: {key: status, equals: PASS}
  - id: revision_ledger
    label: "Immutable model/dataset revision ledger"
    stage: pre_primary
    action: "Run python scripts/resolve_experiment_revisions.py after HF authentication. This freezes the experiment git commit, config hashes, model SHAs, dataset SHAs, and frozen model-config hashes before any parity run."
    artifact: results/revision_ledger.json
    expect: {key: status, equals: PASS}
  - id: gated_dataset_access
    label: "Frozen gated-dataset record access"
    stage: pre_primary
    action: "From the same clean frozen machine, run python scripts/verify_gated_dataset_access.py (the pre-primary freeze wrappers do this automatically). It streams one record from each gated primary dataset at the ledger-resolved SHA and stores no benchmark content. GPQA-Diamond access must PASS before parity/primary execution."
    artifact: results/gated_dataset_access.json
    expect: {key: status, equals: PASS}
  - id: dataset_contracts
    label: "Live exact-revision dataset normalizer/scorer contracts"
    stage: pre_primary
    action: "The official freeze wrappers run python scripts/verify_dataset_contracts.py after revision resolution and gated-access verification. It streams one row from each of the six ledger-pinned primary datasets, verifies the frozen normalizer plus scorer with a constructed correct final answer, stores schema/provenance only (no benchmark row content), and must PASS at the same clean commit with the exact revision-ledger SHA."
    artifact: results/dataset_contracts.json
    expect: {key: status, equals: PASS}
  - id: llada_parity
    label: "LLaDA 20-prompt exact parity"
    stage: pre_primary
    issue: 7
    action: "On A100/Linux run bash scripts/pilot_linux.sh prepare then bash scripts/pilot_linux.sh parity; on Windows use scripts/pilot_windows.ps1 -Stage prepare/-Stage parity. Both paths are non-overwriting, reuse only clean hash-bound parity-v3 evidence, and stop on partial/stale artifacts."
    artifact: results/llada_parity.json
    expect: {key: status, equals: PASS}
  - id: pilot_quality
    label: "LLaDA + GSM8K 50-example pilot quality"
    stage: pre_primary
    issue: 1
    action: "After LLaDA parity PASS, on A100/Linux run bash scripts/pilot_linux.sh pilot; on Windows use scripts/pilot_windows.ps1 -Stage pilot. The pilot-quality v2 artifact must be a clean-checkout, hash-bound PASS at the frozen commit/model revision, and primary readiness additionally requires matching raw/scored SHA-256 audits."
    artifact: results/llada_gsm8k_pilot50_gate.json
    expect: {key: status, equals: PASS}
  - id: pilot_manual
    label: "10-trace human pilot review"
    stage: pre_primary
    issue: 1
    action: "Inspect the exported 10-trace sheet and record the protocol-v2 attestation with scripts/record_manual_gate.py from the same frozen clean checkout. The sheet records the exact scored-pilot SHA; recorder/readiness bind that source plus the LLaDA parity and pilot-quality artifacts by SHA-256."
    artifact: results/llada_gsm8k_pilot50_manual_review.json
    expect: {key: status, equals: PASS}
  - id: sdar_parity
    label: "SDAR exact parity"
    stage: pre_primary
    issue: 2
    action: "On A100/Linux run bash scripts/parity_remaining_linux.sh sdar; on Windows run scripts/parity_remaining_windows.ps1 -Model sdar. Require parity-v3 exact 20-prompt token equality, clean frozen provenance, and unchanged reference/instrumented SHA-256 evidence."
    artifact: results/sdar_parity.json
    expect: {key: status, equals: PASS}
  - id: dream_parity
    label: "Dream exact parity"
    stage: pre_primary
    issue: 5
    action: "On A100/Linux run bash scripts/parity_remaining_linux.sh dream; on Windows run scripts/parity_remaining_windows.ps1 -Model dream. Require parity-v3 exact 20-prompt token equality, clean frozen provenance, and unchanged reference/instrumented SHA-256 evidence."
    artifact: results/dream_parity.json
    expect: {key: status, equals: PASS}
  - id: math500_auto
    label: "Automatic MATH-500 scorer audit"
    stage: pre_primary
    issue: 4
    action: "The clean CPU verification already runs scripts/audit_math500_scorer.py. On A100/Linux run bash scripts/math500_gate_linux.sh prepare; on Windows use scripts/math500_gate_windows.ps1 -Stage prepare. Revalidate the clean-checkout protocol-v2 scorer artifact and pinned dependency versions before the calibration pilot."
    artifact: results/math500_scorer_audit.json
    expect: {key: status, equals: PASS}
  - id: math500_manual
    label: "25-example MATH-500 calibration scorer review"
    stage: pre_primary
    issue: 4
    action: "On A100/Linux run bash scripts/math500_gate_linux.sh pilot after prepare; on Windows use scripts/math500_gate_windows.ps1 -Stage all. Generate/audit/score exactly 25 calibration-only examples and export the deterministic review sheet. Inspect all 25 manually before recording the protocol-v2 attestation with scripts/record_math500_scorer_review.py from the same frozen clean checkout."
    artifact: results/math500_scorer_manual_review.json
    expect: {key: status, equals: PASS}
  - id: primary_readiness
    label: "Primary readiness hard gate"
    stage: pre_primary
    action: "Run python scripts/primary_readiness.py and require status=PASS. Readiness v2 requires a clean current checkout matching the revision ledger, the bound dataset-manifest hash, exact CPU protocol/step completion, hash-bound pilot raw/scored audits, source-bound pilot/MATH human attestations, MATH scored-pilot audit evidence, frozen MATH dependency versions, and all three clean exact-parity artifacts with source SHA revalidation. It also emits a SHA-256 source-binding manifest covering every file it validated."
    artifact: results/primary_readiness.json
    expect: {key: status, equals: PASS}
  - id: primary_matrix_plan
    label: "Frozen 18-cell execution plan"
    stage: primary_execution
    issue: 8
    action: "Run python scripts/plan_primary_matrix.py, inspect, and archive the plan before GPU execution. Planning re-hashes the readiness source-binding manifest, revision ledger, exact frozen model-config hashes/paths, split manifests/audits, and calibration/test inputs before emitting the 18-cell plan."
    artifact: results/primary_matrix_plan.json
    expect: {key: status, equals: PASS}
  - id: a100_compute_estimate
    label: "Frozen-input A100 campaign compute forecast"
    stage: primary_execution
    issue: 8
    required: false
    action: "After primary readiness PASS and primary matrix planning, run python scripts/estimate_a100_campaign.py. It uses exact prepared input counts plus audited LLaDA pilot and SDAR/Dream parity wall times to estimate serial A100-hours for primary, RQ2, and RQ3. Planning only; not a paper result."
    artifact: results/a100_compute_estimate.json
    expect: {key: status, equals: PASS}
  - id: primary_execution_complete
    label: "All 18 primary cells fully generated, audited, and scored"
    stage: primary_execution
    issue: 8
    action: "Use python scripts/execute_primary_plan.py --execute to resume the frozen plan. Existing raw/scored artifacts are reusable only with clean protocol-v1, stage-correct, SHA-bound audits from the frozen experiment commit."
    artifact: results/primary_execution_state.json
    expect: {key: status, equals: COMPLETE}
  - id: primary_analysis_plan
    label: "Frozen 18-cell analysis command ledger"
    stage: analysis
    issue: 8
    action: "Run python scripts/plan_primary_analysis.py only after all 18 scored cells have clean protocol-v1 scored audits from the frozen experiment commit. Planning first re-runs the complete primary-plan provenance validator (including readiness source bindings), then protocol v2 SHA-binds the scored inputs/audits plus the primary plan/config and commit."
    artifact: results/primary_analysis_plan.json
    expect: {key: status, equals: PASS}
  - id: primary_analysis_execution_complete
    label: "All 18 primary analyses plus primary/ablation/prior-signal macros and RQ1 gate complete"
    stage: analysis
    issue: 8
    action: "Use python scripts/execute_primary_analysis.py --execute to resume cell analyses, the primary macro, complete 18-cell feature-ablation macro, complete 18-cell prior-aligned signal diagnostic macro, and frozen RQ1 gate. Execution refuses drift in plan-bound scored inputs, audits, primary plan/config, or experiment commit."
    artifact: results/primary_analysis_execution_state.json
    expect: {key: status, equals: COMPLETE}
  - id: repeated_sampling_plan
    label: "Frozen five-sample 18-cell comparator plan"
    stage: analysis
    issue: 9
    action: "Run python scripts/plan_repeated_sampling.py only after primary analysis predictions exist. Planning revalidates the primary-analysis plan and its nested primary/readiness provenance before protocol v2 binds upstream plans/config, prompt partitions, scored targets/audits, and TrajUQ predictions by SHA-256."
    artifact: results/repeated_sampling_plan.json
    expect: {key: status, equals: PASS}
  - id: repeated_execution_complete
    label: "All 18 five-sample cells plus macro complete"
    stage: analysis
    issue: 9
    action: "Use python scripts/execute_repeated_sampling.py --execute to resume the five-seed comparator. Upstream scored audits and every reused seed raw audit must be protocol-v1, clean, SHA-bound, and from the frozen experiment commit. Repeated macro protocol v2 additionally requires valid test-time auxiliary wall-clock metadata in all 18 cells and a clean source binding to the frozen plan plus every consumed scored target, TrajUQ prediction, repeated metric, and repeated prediction artifact."
    artifact: results/repeated_sampling_execution_state.json
    expect: {key: status, equals: COMPLETE}
  - id: adaptive_matrix_plan
    label: "Frozen adaptive 18-cell plan"
    stage: analysis
    issue: 10
    action: "Run python scripts/plan_adaptive_runs.py after all refined primary scored artifacts have clean frozen-commit protocol-v1 scored audits. Planning revalidates the primary/readiness provenance chain before protocol v3 binds the plan/config, prompt inputs, refined artifacts, and audits by SHA-256."
    artifact: results/adaptive_matrix_plan.json
    expect: {key: status, equals: PASS}
  - id: adaptive_execution_complete
    label: "All adaptive base runs, 25/50/75% evaluations, and macros complete"
    stage: analysis
    issue: 10
    action: "Use python scripts/execute_adaptive_plan.py --execute to resume the full RQ3 matrix. Refined and reusable low-budget base audits must remain protocol-v1, clean, stage-correct, SHA-bound, and tied to the frozen experiment commit. Every adaptive macro is additionally source-bound to the frozen plan plus each consumed refined target, cap result, and prediction artifact before reuse."
    artifact: results/adaptive_execution_state.json
    expect: {key: status, equals: COMPLETE}
  - id: primary_macro
    label: "Complete primary 18-cell macro result"
    stage: analysis
    issue: 8
    artifact: results/primary_analysis/macro_primary.json
    expect: {key: cell_set_complete, equals: true}
  - id: feature_ablation_macro
    label: "Complete frozen 18-cell feature-ablation macro result"
    stage: analysis
    issue: 8
    artifact: results/primary_analysis/macro_feature_ablation.json
    expect: {key: cell_set_complete, equals: true}
  - id: rq1_claim_gate
    label: "RQ1 claim decision frozen"
    stage: analysis
    issue: 8
    artifact: results/primary_analysis/rq1_claim_gate.json
    expect:
      key: decision
      in:
        - SUPPORT_POSITIVE_RQ1_CLAIM
        - DO_NOT_MAKE_POSITIVE_RQ1_CLAIM
  - id: repeated_macro
    label: "Complete repeated-sampling 18-cell macro result with compute accounting"
    stage: analysis
    issue: 9
    artifact: results/repeated_sampling/macro_trajuq_vs_repeated.json
    expect: {key: auxiliary_compute.complete, equals: true}
  - id: adaptive_macro
    label: "Complete adaptive primary-cap 18-cell macro result"
    stage: analysis
    issue: 10
    artifact: results/adaptive/macro_cap_050.json
    expect: {key: cell_set_complete, equals: true}
  - id: hybrid_rq4_result
    label: "Held-out FLARE same-checkpoint RQ4 diagnostic"
    stage: diagnostic
    required: false
    issue: 3
    action: "Optional diagnostic: run same-checkpoint AR/diffusion RQ4 only after FLARE parity/trace gates pass."
    artifact: results/flare_rq4_hybrid.json
    expect: {key: role, equals: RQ4_DIAGNOSTIC_NOT_PRIMARY_ENDPOINT}
  - id: result_figures
    label: "Artifact-derived aggregate result figure manifest"
    stage: submission
    issue: 11
    action: "Run python scripts/render_paper_result_figures.py after the complete primary and all three adaptive-cap macros exist. Require protocol v2 with SHA-bound primary/config/cap sources and all three PDF outputs."
    artifact: paper/figures/generated/result_figure_manifest.json
    expect: {key: protocol, equals: trajuq_paper_result_figures_v2}
  - id: rendered_results
    label: "Artifact-derived paper result manifest"
    stage: submission
    issue: 11
    action: "Run python scripts/render_results_tex.py and python scripts/render_paper_result_figures.py. The text renderer SHA-binds primary, claim-gate, repeated, feature-ablation, prior-aligned signal, adaptive, and primary-config sources; the figure renderer binds primary/config plus all three adaptive-cap sources. Commit/stash final tracked paper changes, then run python scripts/submission_readiness.py from a clean submission checkout before ACL pubcheck."
    artifact: paper/generated_results_manifest.json
    expect: {key: protocol, equals: trajuq_paper_results_render_v1}
  - id: submission_readiness
    label: "Final repository-side ARR submission readiness"
    stage: submission
    issue: 11
    action: "From a clean submission checkout after artifact-derived result rendering and paper audit, run python scripts/submission_readiness.py and require status=PASS before the external ACL/ARR compile, pubcheck, anonymity, and upload checks."
    artifact: results/submission_readiness.json
    expect: {key: status, equals: PASS}
