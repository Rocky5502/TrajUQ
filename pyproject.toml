[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "traj-uq"
version = "0.1.0"
description = "Trajectory-aware uncertainty estimation for diffusion language models"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "scikit-learn>=1.3",
  "PyYAML>=6.0",
]

[project.optional-dependencies]
models = [
  "torch>=2.3",
  "transformers>=4.45",
  "datasets>=3.0",
  "accelerate>=0.34",
  "sentencepiece>=0.2",
]
dev = [
  "pytest>=8.0",
  "ruff>=0.6",
]
math = [
  "math-verify[antlr4_13_2]==0.9.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"
